<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>CISA · Video en vivo</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
        <link href="static/css/Livevideo.css" type="text/css" rel="stylesheet">
    </head>
    <body>

        <header id="header" style="position:relative;z-index:100;">
        <div class="logo">cisa</div>
        <span class="logo-sub">Video en vivo</span>
        <div class="pills">
            <span class="pill"><span class="dot" id="dot-yolo"></span><span id="txt-yolo">YOLO…</span></span>
            <span class="pill"><span class="dot" id="dot-pg"></span><span id="txt-pg">PG</span></span>
            <span class="pill"><span class="dot" id="dot-cam"></span><span id="txt-cam">CAM</span></span>
        </div>
        <div class="track-badge hidden" id="track-badge">🚌 <span id="track-txt">—</span></div>
        <div class="spacer"></div>
        <!-- Selector de cámara -->
        <div class="cam-switch">
            <button class="cam-btn active" id="btn-cam1" onclick="switchCamera(1)"><span class="cd"></span>Cam 1</button>
            <button class="cam-btn" id="btn-cam2" onclick="switchCamera(2)"><span class="cd"></span>Cam 2</button>
        </div>
        <a class="hdr-link" href="/">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            Dashboard
        </a>
        <span class="hora" id="hora">—</span>
        </header>

        <div id="main">
        <div id="video-panel">
            <span class="live-tag"><i></i> En vivo</span>
            <img id="video" alt="">
            <div id="vid-overlay">
            <div class="spinner"></div>
            <div class="overlay-txt">Conectando al stream…</div>
            </div>
            <div id="cam-switching">
            <div class="sw-spinner"></div>
            <div class="sw-text" id="sw-text">CONECTANDO CÁMARA…</div>
            </div>
        </div>

        <div id="det-panel">
            <div id="det-header">
                <span class="panel-title">Detecciones</span>
                <span id="panel-count">0</span>
            </div>

            <div id="det-tools">
                <div class="det-search">
                    <svg class="det-search-ico" width="14" height="14" viewBox="0 0 24 24"
                         fill="none" stroke="currentColor" stroke-width="2.2"
                         stroke-linecap="round" aria-hidden="true">
                        <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
                    </svg>
                    <input id="det-q" type="search" autocomplete="off"
                           placeholder="Buscar número o empresa…"
                           aria-label="Buscar por número económico o empresa">
                    <button id="det-q-clear" class="det-x" type="button"
                            title="Limpiar búsqueda" aria-label="Limpiar búsqueda" hidden>×</button>
                </div>

                <div class="det-filter-row">
                    <select id="det-empresa" aria-label="Filtrar por empresa">
                        <option value="">Todas las empresas</option>
                    </select>

                    <div class="det-date-wrap">
                        <button id="det-date-btn" class="det-filter-btn" type="button"
                                aria-haspopup="dialog" aria-expanded="false">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none"
                                 stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                 aria-hidden="true">
                                <rect x="3" y="5" width="18" height="16" rx="2"/>
                                <path d="M16 3v4M8 3v4M3 10h18"/>
                            </svg>
                            <span id="det-date-label">Fechas</span>
                        </button>

                        <div id="det-date-pop" class="det-pop" role="dialog"
                             aria-label="Filtrar detecciones por fechas" hidden>
                            <div class="det-pop-title">Filtrar por fechas</div>
                            <label class="det-date-field">
                                <span>Desde</span>
                                <input id="det-desde" type="date">
                            </label>
                            <label class="det-date-field">
                                <span>Hasta</span>
                                <input id="det-hasta" type="date">
                            </label>
                            <div class="det-presets">
                                <button type="button" data-preset="hoy">Hoy</button>
                                <button type="button" data-preset="ayer">Ayer</button>
                                <button type="button" data-preset="7d">7 días</button>
                            </div>
                            <div class="det-pop-hint" id="det-date-hint">
                                Se filtra por día operativo.
                            </div>
                            <div class="det-pop-actions">
                                <button type="button" id="det-date-clear" class="det-link">Limpiar</button>
                                <button type="button" id="det-date-apply" class="det-primary">Aplicar</button>
                            </div>
                        </div>
                    </div>

                    <button id="det-filters-clear" class="det-clear-filters" type="button"
                            title="Quitar todos los filtros" hidden>Limpiar</button>
                </div>
            </div>

            <div id="tiles">
                <div id="empty">
                    <div class="empty-icon">🚌</div>
                    <span id="empty-txt">Esperando detecciones…</span>
                </div>
            </div>

            <div id="det-footer">
                <span id="det-shown"></span>
                <div id="det-pager">
                    <button id="det-refresh" class="det-page-btn" type="button"
                            title="Actualizar detecciones" aria-label="Actualizar detecciones">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
                             stroke-linejoin="round" aria-hidden="true">
                            <path d="M21 12a9 9 0 1 1-2.64-6.36"/>
                            <path d="M21 3v6h-6"/>
                        </svg>
                    </button>
                    <button id="det-prev" class="det-page-btn" type="button"
                            title="Página anterior" aria-label="Página anterior">‹</button>
                    <span id="det-page-info">1 / 1</span>
                    <button id="det-next" class="det-page-btn" type="button"
                            title="Página siguiente" aria-label="Página siguiente">›</button>
                </div>
            </div>
        </div>
        </div>

        <!-- Modal -->
        <div id="modal" onclick="if(event.target===this)closeModal()">
        <div id="modal-box">
            <button id="modal-close" onclick="closeModal()">✕</button>
            <div id="modal-fotos">
                <img id="modal-img" src="" alt="">
                <button id="modal-prev" class="modal-flecha" type="button" onclick="cambiarFoto(-1)"
                        title="Foto anterior" aria-label="Foto anterior">‹</button>
                <button id="modal-next" class="modal-flecha" type="button" onclick="cambiarFoto(1)"
                        title="Foto siguiente" aria-label="Foto siguiente">›</button>
                <div id="modal-cuenta"></div>
            </div>
            <div id="modal-miniaturas"></div>
            <div id="modal-body">
            <div id="modal-num">—</div>
            <div class="mrow"><span class="mlabel">Empresa</span><span class="mval" id="m-emp">—</span></div>
            <div class="mrow"><span class="mlabel">Movimiento</span><span class="mval" id="m-dir">—</span></div>
            <div class="mrow"><span class="mlabel">OCR leyó</span><span class="mval" id="m-leido">—</span></div>
            <div class="mrow"><span class="mlabel">Estado</span><span class="mval" id="m-estado">—</span></div>
            <div class="mrow"><span class="mlabel">Confianza YOLO</span><span class="mval" id="m-conf">—</span></div>
            <div class="mrow"><span class="mlabel">Hora</span><span class="mval" id="m-ts">—</span></div>
            <div class="mrow"><span class="mlabel">Clase</span><span class="mval" id="m-cls">—</span></div>
            </div>
        </div>
        </div>

        <script src="static/js/Livevideo.js"></script> 
    </body>
</html>
